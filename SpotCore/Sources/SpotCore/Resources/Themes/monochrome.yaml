# Monochrome: charcoal and paper, every interval a shade of grey (darkest for the notes that make the chord,
# palest for the colour tones). The interval names on the notes carry the rest.

name: Monochrome

interface:
  page: "#1F1F1F"
  panel: "#262626"
  panelHover: "#1A1A1A"
  card: "#181818"
  header: "#E9E6DE"
  headerText: "#1F1F1F"
  footer: "#0D0D0D"
  text: "#F2F2F2"
  secondaryText: "#9A9A9A"
  dimmed: "#4A4A4A"
  accent: "#F2F2F2"
  warning: "#D9D9D9"
  error: "#BDBDBD"

list:
  background: "#E9E6DE"
  row: "#F6F4EE"
  alternateRow: "#EDEAE2"
  hover: "#3A3A3A"
  selected: "#1F1F1F"
  text: "#1F1F1F"
  selectedText: "#F2F2F2"

fretboard:
  background: "#F4F1E8"
  ink: "#2B2B2B"
  strings: "#9C9890"
  frets: "#55524C"
  inlays: rgba(43, 43, 43, 0.15)
  nut: "#D8D4CA"
  note: "#FBFAF6"
  openNote: "#4A4A4A"

intervals:
  root: "#000000"
  m3: "#2E2E2E"
  M3: "#444444"
  TT: "#575757"
  P5: "#6B6B6B"
  m7: "#808080"
  M7: "#959595"
  m2: "#AAAAAA"
  M2: "#BEBEBE"
  P4: "#CDCDCD"
  m6: "#DADADA"
  M6: "#E8E8E8"

roles:
  chordTone: "#444444"
  tension: "#959595"
  avoid: "#D0D0D0"

sequencer:
  chord: "#BDBDBD"
  invalidChord: "#6B6B6B"
  pattern: "#E0E0E0"
  nextChord: "#E0E0E0"
  waveform: "#CFCFCF"
  playhead: "#FFFFFF"
  loop: "#E0E0E0"
  warpMarker: "#E0E0E0"
  activeWarpMarker: "#FFFFFF"
  songMarker: "#BDBDBD"
  take: "#8A8A8A"

tab:
  selection: "#E0E0E0"
  playhead: "#FFFFFF"
  chordName: "#BDBDBD"
  error: "#9A9A9A"
